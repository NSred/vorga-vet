services:
  - name: vorgavet-api
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    rootDir: backend
    dockerfilePath: ./src/Web.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ConnectionStrings__Database
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: vorga-vet
      - key: Jwt__Audience
        value: vorga-vet-test
      - key: Jwt__ExpirationInMinutes
        value: "60"
      - key: Clinic__VeterinarianEmails__0
        sync: false
      - key: Clinic__VeterinarianEmails__1
        sync: false
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Seeding__DemoData
        value: "true"

  - name: vorgavet
    type: web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://vorgavet-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
